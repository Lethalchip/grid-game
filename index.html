<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>click fast!</title>
  </head>
  <body>
    <div id="app" class="app">
      <h1 class="title">unnamed grid clicking game</h1>

      <div class="hud">
        <div class="hud-item">
          <div class="hud-label">Score</div>
          <div class="hud-value" id="score">0</div>
        </div>

        <div class="hud-item">
          <div class="hud-label">High Score</div>
          <div class="hud-value" id="highScore">0</div>
        </div>

        <div class="hud-item">
          <div class="hud-label">Time</div>
          <div class="hud-value"><span id="time">30.0</span>s</div>
        </div>

        <div class="hud-buttons">
          <button id="actionBtn" type="button">Start</button>
        </div>
      </div>

      <div class="board-wrap" aria-label="4 by 4 grid">
        <div id="board" class="board"></div>
        <div id="overlay" class="overlay" role="status" aria-live="polite"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
